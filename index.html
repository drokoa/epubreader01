<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 关键：加上移动端自适应视口 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EPUB 阅读器</title>
<style>
  /* 基础重置与排版 */
  body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
  /* 移动端顶部栏适配 */
  #top-bar { padding: 10px; background: #fff; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #reader-content { padding: 10px; }
  
  /* 关键：漫画图片竖屏自适应（宽度100%，高度自动） */
  #reader-content img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  
  /* 关键：RTL(从右往左)布局支持 */
  .rtl-layout { direction: rtl; text-align: right; }
  .rtl-layout img { margin: 0 0 0 auto; }

  /* 按钮样式 */
  button { padding: 8px 12px; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="library">
  <h2>EPUB 阅读器</h2>
  <input type="file" id="file-input" accept=".epub">
</div>

<div id="reader" class="hidden">
  <div id="top-bar">
    <button id="back-btn">← 返回目录</button>
    <span id="chapter-title"></span>
    <select id="direction-select">
      <option value="ltr">从左往右</option>
      <option value="rtl">从右往左</option>
    </select>
  </div>
  <div id="reader-content"></div>
  <div style="padding: 10px; display: flex; justify-content: space-between;">
    <button id="prev-btn">← 上一章</button>
    <button id="next-btn">下一章 →</button>
  </div>
</div>

<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
