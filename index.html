<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>EPUB 阅读器</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #e5e5ea;
    --accent: #0a84ff;
    --radius: 14px;
    --measure: 760px;
    --gutter: max(10px, calc((100% - var(--measure)) / 2));
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    overscroll-behavior: none;
  }
  button { font-family: inherit; }

  /* ---------------- 书架 ---------------- */
  #library { max-width: 1000px; margin: 0 auto; padding: 26px 20px 64px; }
  #library.hidden { display: none; }

  .lib-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .lib-header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  .lib-sub { margin: 5px 0 0; font-size: 13px; color: var(--muted); }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 500;
    cursor: pointer; box-shadow: 0 2px 10px rgba(10, 132, 255, .28);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn-primary:hover { box-shadow: 0 4px 16px rgba(10, 132, 255, .34); }
  .btn-primary:active { transform: scale(.97); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .notice {
    margin-bottom: 18px; padding: 12px 16px;
    background: #fff8e6; border: 1px solid #ffe2a8; border-radius: 12px;
    color: #7a5b00; font-size: 13px; line-height: 1.65;
  }
  .notice code {
    background: rgba(0, 0, 0, .06); padding: 2px 6px;
    border-radius: 5px; font-size: 12px;
  }
  .notice.hidden { display: none; }

  .book-grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  }
  .book-grid.hidden { display: none; }

  .book-card {
    position: relative; display: flex; align-items: center; gap: 13px;
    padding: 12px; background: var(--card); border-radius: var(--radius);
    border: 1px solid transparent; cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease, border-color .15s ease;
  }
  .book-card:hover {
    box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    transform: translateY(-1px);
  }
  .book-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .book-card:active { transform: scale(.995); }

  .book-cover {
    flex: 0 0 46px; height: 64px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 21px; font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
    user-select: none;
  }

  .book-info { flex: 1; min-width: 0; }
  .book-title {
    font-size: 14.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-author {
    margin-top: 2px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-bar {
    height: 4px; margin-top: 9px; border-radius: 2px;
    background: var(--line); overflow: hidden;
  }
  .book-bar > i {
    display: block; height: 100%; width: 0;
    background: var(--accent); border-radius: 2px;
    transition: width .3s ease;
  }
  .book-meta {
    display: flex; justify-content: space-between; gap: 8px;
    margin-top: 6px; font-size: 11.5px; color: var(--muted);
  }
  .book-meta > span:last-child { flex: 0 0 auto; }

  .book-del {
    position: absolute; top: 7px; right: 7px;
    width: 22px; height: 22px; padding: 0; border: none; border-radius: 50%;
    background: rgba(0, 0, 0, .05); color: var(--muted);
    font-size: 11px; line-height: 1; cursor: pointer;
    opacity: 0; transition: opacity .15s ease, background .15s ease;
  }
  .book-card:hover .book-del,
  .book-card:focus-within .book-del { opacity: 1; }
  .book-del:hover { background: rgba(255, 59, 48, .12); color: #ff3b30; }
  @media (hover: none) { .book-del { opacity: 1; } }

  .empty { padding: 72px 20px; text-align: center; color: var(--muted); }
  .empty.hidden { display: none; }
  .empty-icon { font-size: 42px; margin-bottom: 12px; opacity: .55; }
  .empty p { margin: 6px 0; }
  .empty .hint { font-size: 13px; opacity: .8; }

  /* ---------------- 阅读器 ---------------- */
  #reader {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; background: #fff;
  }
  #reader.hidden { display: none; }

  #top-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px var(--gutter);
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .94);
    backdrop-filter: saturate(180%) blur(12px);
  }
  #chapter-title {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progress-chip {
    flex: 0 0 auto; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; padding: 0 2px;
  }

  .icon-btn {
    flex: 0 0 auto; width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 9px; background: transparent;
    color: var(--text); font-size: 17px; line-height: 1; cursor: pointer;
    transition: background .15s ease;
  }
  .icon-btn:hover { background: rgba(0, 0, 0, .06); }
  .icon-btn:active { background: rgba(0, 0, 0, .1); }

  #direction-select {
    flex: 0 0 auto; font-size: 13px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--text); cursor: pointer;
  }

  #reader-content { position: relative; flex: 1; overflow: hidden; background: #fff; }

  .page-layer {
    position: absolute; top: 0; left: 0; right: 0;
    max-width: var(--measure); margin: 0 auto;
    height: 100%; padding: 16px 20px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    will-change: transform;
  }
  .page-layer.slide-in-right { transform: translateX(100%); }
  .page-layer.slide-in-left  { transform: translateX(-100%); }
  .page-layer.to-center      { transform: translateX(0); }
  .page-layer.animate        { transition: transform .3s ease-out; }
  .page-layer.out-left       { transform: translateX(-100%); }
  .page-layer.out-right      { transform: translateX(100%); }

  .page-layer img { max-width: 100%; height: auto; display: block; margin: 10px auto; }
  .page-layer p { margin: 0 0 13px; line-height: 1.85; }
  .page-layer h1, .page-layer h2, .page-layer h3 { line-height: 1.4; }
  .page-layer a { color: var(--accent); }

  .rtl-layout { direction: rtl; text-align: right; }
  .rtl-layout img { margin: 10px 0 10px auto; }

  #page-controls {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px var(--gutter); border-top: 1px solid var(--line); background: #fff;
  }
  #page-controls button {
    flex: 1; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
    transition: opacity .15s ease;
  }
  #page-controls button:disabled { background: #cfcfd4; cursor: default; }

  /* ---------------- 目录抽屉 ---------------- */
  #toc-mask {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, .35);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #toc-mask.show { opacity: 1; pointer-events: auto; }

  #toc-panel {
    position: absolute; top: 0; bottom: 0; left: 0; z-index: 11;
    width: min(320px, 84vw);
    display: flex; flex-direction: column;
    background: #fff; box-shadow: 2px 0 24px rgba(0, 0, 0, .14);
    transform: translateX(-101%);
    transition: transform .28s cubic-bezier(.22, .9, .3, 1);
  }
  #toc-panel.open { transform: translateX(0); }

  .toc-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 10px 12px 18px; border-bottom: 1px solid var(--line);
  }
  .toc-header > span { font-size: 14px; font-weight: 600; }

  #toc-list { flex: 1; overflow-y: auto; padding: 6px 0 28px; -webkit-overflow-scrolling: touch; }

  .toc-item {
    display: block; width: 100%; padding: 11px 18px;
    border: none; border-left: 3px solid transparent;
    background: none; color: var(--text);
    font-size: 14px; line-height: 1.45; text-align: left; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .toc-item:hover { background: rgba(0, 0, 0, .04); }
  .toc-item.active {
    color: var(--accent); font-weight: 600;
    border-left-color: var(--accent); background: rgba(10, 132, 255, .07);
  }
  .toc-item[data-depth="1"] { padding-left: 32px; font-size: 13.5px; color: #48484a; }
  .toc-item[data-depth="2"] { padding-left: 46px; font-size: 13px; color: #6c6c70; }
  .toc-item.active[data-depth="1"],
  .toc-item.active[data-depth="2"] { color: var(--accent); }

  .toc-empty { padding: 28px 20px; font-size: 13px; color: var(--muted); text-align: center; }

  /* ---------------- 拖拽导入 ---------------- */
  body.drag-over::after {
    content: "松开以导入 EPUB";
    position: fixed; inset: 12px; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: 18px;
    background: rgba(10, 132, 255, .07);
    color: var(--accent); font-size: 18px; font-weight: 600;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- ==================== 书架 ==================== -->
<div id="library">
  <header class="lib-header">
    <div>
      <h1>📚 EPUB 阅读器</h1>
      <p class="lib-sub" id="lib-sub">本地书库 · 文件保存在这台设备的浏览器中</p>
    </div>
    <label class="btn-primary" for="file-input">＋ 导入 EPUB</label>
    <input class="visually-hidden" type="file" id="file-input" accept=".epub,application/epub+zip" multiple>
  </header>

  <div id="storage-warning" class="notice hidden"></div>

  <div id="book-list" class="book-grid"></div>

  <div id="empty-state" class="empty">
    <div class="empty-icon">📚</div>
    <p>还没有导入任何书籍</p>
    <p class="hint">点击「导入 EPUB」，或把 .epub 文件拖到这里</p>
  </div>
</div>

<!-- ==================== 阅读器 ==================== -->
<div id="reader" class="hidden">
  <div id="top-bar">
    <button id="back-btn" class="icon-btn" type="button" title="返回书架">←</button>
    <button id="toc-btn" class="icon-btn" type="button" title="目录">☰</button>
    <span id="chapter-title"></span>
    <span id="chapter-progress" class="progress-chip"></span>
    <select id="direction-select" title="阅读方向">
      <option value="ltr">从左往右</option>
      <option value="rtl">从右往左</option>
    </select>
  </div>

  <div id="reader-content"></div>

  <div id="page-controls">
    <button id="prev-btn" type="button">← 上一章</button>
    <button id="next-btn" type="button">下一章 →</button>
  </div>

  <div id="toc-mask"></div>
  <aside id="toc-panel">
    <div class="toc-header">
      <span>目录</span>
      <button id="toc-close" class="icon-btn" type="button" title="关闭">✕</button>
    </div>
    <div id="toc-list"></div>
  </aside>
</div>

<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
